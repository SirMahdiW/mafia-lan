name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ساخت APK (Gradle ${{ matrix.java }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: برداشت کد
        uses: actions/checkout@v4

      - name: نصب JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: ساخت APK دیباگ
        run: gradle assembleDebug --no-daemon --console=plain

      - name: اجرای تست خط فرمان پروژه (test/TestMain.kt)
        run: bash tools/run_cli_test.sh

      - name: محاسبهٔ SHA-256
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          cat app-debug.apk.sha256

      - name: بارگذاری APK به‌عنوان artifact
        uses: actions/upload-artifact@v4
        with:
          name: mafia-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 90
          if-no-files-found: error

      - name: ایجاد Release پیش‌نویس و بارگذاری APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "app/build/outputs/apk/debug/app-debug.apk" \
            --title "Mafia LAN ${{ github.ref_name }}" \
            --notes "۵ تغییر رفتاری: تفنگدار، گودمن، سه نفر آخر، جک، دکتر. کارت تغییر چهره جک فعلاً پیاده نشده." \
            --prerelease
