var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var c, mc, r, mr, qrSvg='', rect;

        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';

function locRows(){return `<h2>تنظیمات گرداننده</h2><div class="clay row ${CFG.manual?'on':''}" onclick="tgl('manual')"><span style="font-size:30px">🎙️</span><div style="flex:1"><b>گرداننده‌ی انسانی</b><span class="mu">متن را خودم می‌خوانم و با دکمه‌ی «ادامه» زمان‌بندی را کنترل می‌کنم؛ خاموش = برنامه خودکار پیش می‌رود</span></div><div class="tg"></div></div><div class="clay row ${CFG.voice?'on':''}" onclick="tgl('voice')"><span style="font-size:30px">🔊</span><div style="flex:1"><b>صدای برنامه</b><span class="mu">اعلام‌ها با صدا پخش شود</span></div><div class="tg"></div></div><div class="clay row ${CFG.twoRound?'on':''}" onclick="tgl('twoRound')"><span style="font-size:30px">⚖️</span><div style="flex:1"><b>رأی‌گیری دو مرحله‌ای با دفاعیه</b><span class="mu">کسی که رأی حداقل نیمی از حاضران را بگیرد به دفاعیه می‌رود؛ بعد رأی دوم</span></div><div class="tg"></div></div>`}
function setupPanel(n,go,loc){const c=cnt(),er=cfgErr(n,c),mx=Math.max(1,Math.floor((n-1)/2));if(CFG.mafia>mx)CFG.mafia=mx;
 let h=`<div class="clay blk c"><b style="font-size:28px">${c.total}/${n}</b><p class="mu">${er||('بقیه‌ی نفرات: '+(n-c.total)+' شهروند ساده')}</p></div><h2>سناریوهای پیشنهادی ${n} نفره</h2><div class="g">`+PRE.map((p,i)=>n>=p[1]?`<button class="nm" onclick="pre(${i},${n})">🎬 ${p[0]}</button>`:'').join('')+`</div><h2>تعیین دستی نقش‌ها</h2><div class="clay blk"><p class="mu">تعداد کل مافیا (با نقش‌های مافیایی)</p><div class="chips">`+Array.from({length:mx},(_,i)=>`<button class="chip ${CFG.mafia==i+1?'on':''}" onclick="mc(${i+1})">${i+1}</button>`).join('')+'</div></div>';
 for(const g of GR)h+=`<h2>${g[0]}</h2><div class="g">`+g[1].map(k=>`<div class="clay rl ${CFG[k]?'on':''}" onclick="tgl('${k}')"><div class="ic">${RM[k][0]}</div><b>${RM[k][1]}${k=='freemason'?' (۲ نفر)':''}</b><span class="mu">${RM[k][2]}</span><div class="tg"></div></div>`).join('')+'</div>';
 h+=`<h2>قوانین</h2><div class="clay row ${CFG.reveal?'on':''}" onclick="tgl('reveal')"><span style="font-size:30px">👁️</span><div style="flex:1"><b>نمایش نقش حذف‌شده</b><span class="mu">نقش بازیکن اخراج‌شده فاش شود</span></div><div class="tg"></div></div><div class="clay row ${CFG.docRule?'on':''}" onclick="tgl('docRule')"><span style="font-size:30px">💊</span><div style="flex:1"><b>قانون دکتر</b><span class="mu">دو شب پشت‌سرهم یک نفر را نجات ندهد</span></div><div class="tg"></div></div><div class="clay row ${CFG.votes?'on':''}" onclick="tgl('votes')"><span style="font-size:30px">🗳️</span><div style="flex:1"><b>نمایش رأی‌ها</b><span class="mu">فقط در بازی چندگوشی</span></div><div class="tg"></div></div><div class="clay row"><span style="font-size:30px">🎙️</span><div style="flex:1"><b>زمان صحبت هر نفر</b><span class="mu">در هر روز، به نوبت</span></div><button class="chip" onclick="sp(-15)">−</button><b>${CFG.speak}ث</b><button class="chip" onclick="sp(15)">+</button></div>`;
 return h+(loc?locRows():'')+(er?`<p class="err c">${er}</p>`:'')+`<button class="big" ${er?'disabled':''} onclick="${go}">شروع بازی ▶</button>`}
function render(){const v=V||{phase:'lobby',me:null,players:[],log:[],say:null,rem:0,paused:false,night:1},night=v.phase=='intro'||v.phase=='night';document.body.className=night?'nt':'';let h='';tm.textContent='';
 if(!v.me){

  if(HQ&&!MODE)return $.innerHTML=`<div class="hero clay">🎭</div><h1 class="c">بازی مافیا</h1><p class="mu c">چطور بازی کنیم؟</p><button class="big" onclick="MODE='multi';render()">📱 بازی چندگوشی<br><span style="font-weight:400;font-size:13px">هر بازیکن با گوشی خودش (هات‌اسپات و QR)</span></button><button class="big" style="background:linear-gradient(160deg,#5b4bd6,#2e2494)" onclick="MODE='local';render()">🎙️ حالت گرداننده<br><span style="font-weight:400;font-size:13px">من گردانندهام؛ فقط همین یک گوشی، آفلاین</span></button><button onclick="rules()">📖 شرح بازی و نقش‌ها</button>`;
  return $.innerHTML=`<div class="hero clay">🎭</div><h1 class="c">بازی مافیا</h1><p class="mu c">نام خود را بنویسید و وارد شوید</p><input id="nm" maxlength="16" placeholder="نام شما" oninput="ls('mf_name',this.value)" value="${e(ls('mf_name')||'')}"><button class="big" id="jb" onclick="join()">ورود به بازی ▶</button><button onclick="rules()">📖 شرح بازی</button><p id="er" class="mu c err"></p>`}
 const me=v.me,p=v.prompt,n=v.players.length;
 if(v.phase=='lobby'){h=`<h1>سالن انتظار</h1><div class="g">`+v.players.map(q=>`<div class="clay nm">${av(q.name)}${e(q.name)}</div>`).join('')+'</div>';
  if(me.host){
   if(v.urls&&v.urls.length)h+=`<div class="clay blk c"><p class="mu">QR را اسکن کنید (همه به هات‌اسپات وصل باشند)</p>${v.urls.slice().sort((a,b)=>(b.includes('192.168.')-a.includes('192.168.'))).slice(0,3).map(u=>`<div style="margin:10px 0"><div style="display:inline-block;background:#fff;padding:10px;border-radius:18px;width:190px">${qrSvg(u)}</div><p dir="ltr"><b>${u}</b></p></div>`).join('')}</div>`;
   if(n<3)h+='<p class="mu c">حداقل ۳ نفر لازم است (۲ نفر فقط حالت تست).</p>';
   h+=(n>=3?setupPanel(n,"act({a:'start',cfg:CFG})"):'')+(n<=4&&v.sc&&v.sc.length?v.sc.map(s=>`<button onclick="act({a:'start',sc:${s.i}})">🧪 ${s.n}: ${s.c}</button>`).join(''):'')}

 else if(v.phase=='end'){h=`<div class="clay card m"><p class="mu">برنده</p><h1>${v.winner}</h1></div>`+v.players.map(q=>`<div class="clay pl">${av(q.name)}<b>${e(q.name)}</b><span class="mu">${q.rn}${q.alive?'':' (مرده)'}</span></div>`).join('')+(me.host?(v.local?'<button class="big" onclick="location.reload()">بازی جدید</button>':'<button class="big" onclick="act({a:\'reset\'})">بازی جدید</button>'):'')}
 else if(v.local&&v.phase=='reveal'){
  if(LSEL){const q=v.players.find(x=>x.id==LSEL);cur={role:q.role,rn:q.rn};h=`<h2 class="c">${e(q.name)}، نقشت را ببین</h2><p class="mu c">انگشتت را نگه دار؛ مطمئن شو بقیه نگاه نمی‌کنند.</p><div class="clay card ${q.m?'m':''}"><div class="ic" id="ri">❓</div><h1 id="rn">• • •</h1><p class="mu" id="rd"></p></div><button id="hb" class="big">نگه دار تا ببینی</button>${REFMAP[q.role]?`<button onclick="guide('${q.role}')">📖 راهنمای نقش</button>`:''}<button onclick="lack()">دیدم و بستم</button>`}
  else{const un=v.players.filter(x=>!x.seen);h=`<h2>پخش نقش‌ها</h2><p class="mu">هر نفر شماره‌ی خودش را بزند (${n-un.length} از ${n})</p><div class="g">`+v.players.map(x=>`<button class="nm ${x.seen?'x':''}" ${x.seen?'disabled':''} onclick="seat(${x.id})">${av(x.name)}${e(x.name)}${x.seen?' ✓':''}</button>`).join('')+'</div>'}}
 else if(p&&p.kind=='reveal'){cur={role:me.role,rn:me.rn};const r=RM[me.role]||RM.cit;h=`<h2 class="c">${e(me.name)}، نقشت را ببین</h2><p class="mu c">انگشتت را نگه دار؛ مطمئن شو کسی نگاه نمی‌کند.</p><div class="clay card ${me.m?'m':''}"><div class="ic" id="ri">❓</div><h1 id="rn">• • •</h1><p class="mu" id="rd"></p></div><button id="hb" class="big">نگه دار تا ببینی</button>${REFMAP[me.role]?`<button onclick="guide('${me.role}')">📖 راهنمای نقش</button>`:''}<button onclick="act({})">دیدم و بستم</button>`}
 else if(p&&p.kind=='team')h=`<h2>${p.team.some(t=>t[1]=='فراماسون')?'فراماسون‌ها':'تیم مافیا'}</h2>`+p.team.map(t=>`<div class="clay pl"><b>${e(t[0])}</b><span class="mu">${t[1]}</span></div>`).join('')+`<button class="big" onclick="act({})">همدیگر را شناختیم</button>`;
 else if(p&&p.kind=='know'){const rk=v.local?((v.players.find(x=>x.id==v.actor)||{}).role):me.role;const r=RM[rk]||RM.cit;h=`<div class="clay card"><p class="mu">نقش تو</p><div class="ic">${r[0]}</div><h1>${r[1]}</h1><p class="mu">${r[2]}</p></div>${REFMAP[rk]?`<button onclick="guide('${rk}')">📖 راهنمای نقش</button>`:''}<button class="big" onclick="act({})">شناختم، می‌خوابم</button>`}

 else if(p&&p.kind=='cont')h=`<p class="mu c">🎙️ برای بازیکنان بخوان:</p><div class="clay card"><h2 style="font-size:26px;line-height:1.9">${e(p.text)}</h2></div><button class="big" onclick="act({})">خواندم، ادامه ▶</button>`;
 else if(p&&p.kind=='info')h=`<div class="clay blk">${p.text}</div><button class="big" onclick="act({})">باشه</button>`;
 else if(p&&p.kind=='result')h=`<div class="clay card"><h2>${e(p.name)}</h2><h1>${p.m?'مافیا است':'مافیا نیست'}</h1></div><button class="big" onclick="act({})">فهمیدم، می‌خوابم</button>`;
 else if(p&&p.kind=='pick')h=`<h2>${p.title}</h2>`+(p.votes&&p.votes.length?`<p class="mu">انتخاب‌ها: ${p.votes.map(x=>e(x[0])+'←'+e(x[1])).join('، ')}</p>`:'')+(p.skip?'<button onclick="act({t:-1})">شلیک نمی‌کنم</button>':'')+grid(p.opts);
 else if(p&&p.kind=='tally')h=`<h2>${e(p.title||'شمارش رأی‌ها')}</h2><p class="mu">برای هر نفر تعداد دست‌های بالا را بشمارید.</p>`+p.opts.map(id=>`<div class="clay pl">${av(nm(id))}<b>${e(nm(id))}</b><button class="chip" onclick="tl(${id},-1)">−</button><b>${TL[id]||0}</b><button class="chip" onclick="tl(${id},1)">+</button></div>`).join('')+`<button class="big" onclick="act({tally:TL});TL={}">ثبت رأی‌ها</button>`;
 else if(p&&p.kind=='vote')h=`<h2>رأی‌گیری</h2><p class="mu">به چه کسی رأی می‌دهی؟</p><button onclick="act({t:-1})">ممتنع</button>`+grid(p.opts);
 else if(p&&p.kind=='wait')h=`<div class="z mu">منتظر بقیه...${p.total?` (${p.n} از ${p.total})`:''}</div>`;
 else if(night)h=`<div class="z mu">${me.alive?'همه خوابیده‌اند…':'شما از بازی خارج شده‌اید.'}</div>`;
 else if(v.phase=='day'){const s=v.sp||{cur:-1,q:[],done:[]},mine=s.cur==me.id,ml=mine||me.host;
  h=`<h1>${v.defense?'🛡️ دفاعیه':'☀️ روز '+v.night}</h1>`+v.log.slice(-2).map(l=>`<div class="clay blk">${e(l)}</div>`).join('')+(s.cur>0?`<div class="clay card ${mine?'m':''}"><p class="mu">${mine?'نوبت توست!':'در حال صحبت'}</p><h1>${e(nm(s.cur))}</h1></div>`:'')+
  `<h2>ترتیب صحبت</h2><div class="g">`+s.done.map(id=>`<div class="clay nm x">${av(nm(id))}${e(nm(id))}</div>`).join('')+(s.cur>0?`<div class="clay nm" style="border-color:var(--rd)">${av(nm(s.cur))}${e(nm(s.cur))}</div>`:'')+s.q.map(id=>me.host?`<button class="nm" onclick="act({a:'jump',t:${id}})">${av(nm(id))}${e(nm(id))}</button>`:`<div class="clay nm">${av(nm(id))}${e(nm(id))}</div>`).join('')+'</div>'+
  (ml&&s.cur>0?'<button class="big" onclick="act({a:\'next\'})">⏭ تمام شد، نفر بعدی</button>':'')+(me.host?'<div class="g"><button onclick="act({a:\'add\'})">➕ ۱۵ ثانیه</button><button onclick="act({a:\'skip\'})">🗳️ رفتن به رأی‌گیری</button></div><p class="mu c">برای جابه‌جایی نوبت، روی اسم نفرات بعدی بزنید.</p>':'')}
 else h=`<div class="z mu">${me.alive?'منتظر بقیه...':'شما از بازی خارج شده‌اید.'}</div>`;

 pz.style.display=v.paused?'flex':'none';pz.innerHTML=v.paused?'⏸ بازی متوقف شد'+(me.host?'<button class="big" onclick="act({a:\'resume\'})">ادامه بازی ▶</button>':''):'';

setInterval(()=>{if(V&&V.rem){const s=Math.max(0,Math.round((V.paused?V.rem:V.rem-(Date.now()-V.t0))/1000));tm.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}},500);

if(tok){const st=tok;post('/join',{token:st,host:HQ}).then(r=>{if(r&&r.token){connect()}else{if(tok===st){tok=null;ls('mf_tok','');}connect()}})}else connect();
